<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Puzzle Bubble Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-void: #0d0221;
      --bg-panel: #1a0b3d;
      --neon-pink: #ff2e97;
      --neon-cyan: #00e5ff;
      --neon-purple: #b967ff;
      --neon-yellow: #ffd93d;
      --text-primary: #f4f1ff;
      --text-muted: #b8a9d9;
      --font-display: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* Griglia neon (repeating-linear-gradient) + bagliore centrale + gradiente
         verticale: tutto su background-image, nessun asset esterno. */
      background:
        repeating-linear-gradient(0deg, rgba(0, 229, 255, 0.05) 0px, rgba(0, 229, 255, 0.05) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg, rgba(0, 229, 255, 0.05) 0px, rgba(0, 229, 255, 0.05) 1px, transparent 1px, transparent 40px),
        radial-gradient(ellipse at 50% -10%, rgba(255, 46, 151, 0.25), transparent 60%),
        linear-gradient(180deg, var(--bg-void) 0%, var(--bg-panel) 45%, var(--bg-void) 100%);
      background-color: var(--bg-void);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--bg-panel) 0%, var(--bg-void) 100%);
      color: var(--text-primary);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 229, 255, 0.7), 0 0 18px rgba(0, 229, 255, 0.4);
    }

    button {
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(0, 229, 255, 0.18);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 2px solid var(--neon-cyan);
      outline-offset: 2px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Nav a pills */
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--bg-panel);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 999px;
      padding: 0.35rem;
      margin-bottom: 1.5rem;
    }

    .tab-pill {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .tab-pill:hover {
      color: var(--text-primary);
    }

    .tab-pill.active {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
      color: var(--bg-void);
      box-shadow: 0 0 12px rgba(255, 46, 151, 0.5), 0 0 20px rgba(0, 229, 255, 0.35);
    }

    .tab-pill:focus-visible {
      outline: 2px solid var(--neon-cyan);
      outline-offset: 2px;
    }

    section {
      background: var(--bg-panel);
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    section h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
    }

    /* Form styles */
    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    select, input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--bg-void);
      color: var(--text-primary);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2);
    }

    /* Nuova partita: pulsante + modale */
    .btn-new-match {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
      color: var(--bg-void);
      border: none;
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 16px rgba(255, 46, 151, 0.35);
    }

    .btn-new-match:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(255, 46, 151, 0.55), 0 0 30px rgba(0, 229, 255, 0.4);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Serve esplicito: .modal-overlay{display:flex} batterebbe [hidden] */
    .modal-overlay[hidden] {
      display: none;
    }

    .modal {
      background: var(--bg-panel);
      border: 1px solid var(--neon-purple);
      border-radius: 8px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(185, 103, 255, 0.4);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--neon-pink);
      text-shadow: 0 0 6px rgba(255, 46, 151, 0.4);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 0.25rem 0.5rem;
      line-height: 1;
    }

    .modal-close:hover {
      background: rgba(255, 46, 151, 0.12);
      color: var(--neon-pink);
    }

    .modal-hint {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .player-row {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .player-field {
      flex: 1;
      min-width: 0;
    }

    .winner-pick {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      padding: 0.75rem;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
      background: var(--bg-void);
      cursor: pointer;
      white-space: nowrap;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .winner-pick input[type="radio"] {
      width: auto;
      margin: 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .winner-pick:has(input:checked) {
      border-color: var(--neon-pink);
      background: rgba(255, 46, 151, 0.12);
      color: var(--neon-pink);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
      color: var(--bg-void);
      width: 100%;
      padding: 0.75rem;
      font-weight: 700;
      border: none;
      margin-top: 0.5rem;
      box-shadow: 0 0 16px rgba(255, 46, 151, 0.3);
    }

    /* Il background va ridichiarato: button:hover e' piu' specifico di
       .btn-submit e sbiancherebbe il gradiente sotto al testo scuro. */
    .btn-submit:hover {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(255, 46, 151, 0.5), 0 0 30px rgba(0, 229, 255, 0.35);
    }

    .btn-submit:disabled:hover {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
      transform: none;
      box-shadow: none;
    }

    /* Podio */
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.75rem;
    }

    .podium:not(:empty) {
      margin-bottom: 1.5rem;
    }

    .podium-place {
      flex: 1;
      max-width: 160px;
      text-align: center;
    }

    .podium-medal {
      font-size: 1.5rem;
      line-height: 1;
    }

    .podium-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin: 0.35rem 0 0.15rem;
      overflow-wrap: anywhere;
      color: var(--text-primary);
    }

    /* Permanenza in vetta: solo sul primo posto, in oro come il blocco del
       podio a cui appartiene. */
    .podium-streak {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-yellow);
      margin-bottom: 0.15rem;
      white-space: nowrap;
    }

    .podium-rate {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .podium-record {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .podium-block {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px 8px 0 0;
      color: var(--bg-void);
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .podium-1 .podium-block {
      height: 90px;
      background: linear-gradient(180deg, var(--neon-yellow) 0%, #ff9d00 100%);
      box-shadow: 0 0 18px rgba(255, 217, 61, 0.6);
    }

    .podium-2 .podium-block {
      height: 65px;
      background: linear-gradient(180deg, #d9d9f5 0%, var(--neon-purple) 100%);
      box-shadow: 0 0 14px rgba(185, 103, 255, 0.45);
    }

    .podium-3 .podium-block {
      height: 48px;
      background: linear-gradient(180deg, var(--neon-pink) 0%, #a3195b 100%);
      box-shadow: 0 0 14px rgba(255, 46, 151, 0.45);
    }

    /* Stats styles */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .stat-card {
      background: var(--bg-void);
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-left: 4px solid var(--neon-cyan);
    }

    /* Le card sono ordinate per classifica: senza il numero, una griglia
       ordinata e' indistinguibile da una a caso. */
    .stat-rank {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .stat-player {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-rating {
      font-size: 0.9rem;
      color: var(--neon-pink);
      margin-top: 0.25rem;
    }

    /* History styles */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .history-table th {
      background: var(--bg-void);
      padding: 0.75rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid rgba(0, 229, 255, 0.3);
      color: var(--neon-cyan);
    }

    .history-table td {
      padding: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .history-table tr:hover {
      background: rgba(0, 229, 255, 0.06);
    }

    /* Il vincitore non ha piu' una colonna dedicata: e' il nome stesso, nella
       colonna in cui gia' compare, a portare la corona e l'evidenziazione. */
    .winner-name {
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.45);
    }

    /* Grafici */
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-bottom: 1.25rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .chart-figure {
      margin: 0 0 1.75rem;
    }

    .chart-figure:last-child {
      margin-bottom: 0;
    }

    .chart-title {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .chart-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    /* Il viewBox e' generato sulla larghezza reale del contenitore, quindi
       l'SVG va reso 1:1: senza height:auto il browser userebbe l'altezza di
       default di 150px e schiaccerebbe il grafico. */
    .chart-figure svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Loading & error states */
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top: 3px solid var(--neon-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Errore = rosa neon, successo = ciano neon: stessa coppia di colori del
       resto del tema ma su ruoli opposti, cosi' restano distinguibili anche
       senza fare affidamento sul rosso/verde convenzionale. */
    .error {
      background: rgba(255, 46, 151, 0.15);
      color: var(--neon-pink);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      border-left: 4px solid var(--neon-pink);
    }

    .success {
      background: rgba(0, 229, 255, 0.12);
      color: var(--neon-cyan);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      border-left: 4px solid var(--neon-cyan);
    }

    /* Animazioni show/hide: dichiarate solo dentro no-preference, cosi' con
       prefers-reduced-motion:reduce nessuna regola "animation" esiste per
       questi selettori e l'elemento cambia stato istantaneamente (il JS
       aggira comunque l'attesa di animationend in quel caso, vedi script). */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes tabPanelIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes tabPanelOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-8px); }
      }

      section[role="tabpanel"] {
        animation: tabPanelIn 0.18s ease-out;
      }

      /* Specificita' maggiore della regola sopra: mentre e' presente vince
         lei, quindi rimpiazza l'animazione di ingresso con quella di uscita. */
      section[role="tabpanel"].tab-leaving {
        animation: tabPanelOut 0.13s ease-in forwards;
      }

      @keyframes modalOverlayIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes modalOverlayOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes modalPopIn {
        from { opacity: 0; transform: scale(0.9); }
        60% { transform: scale(1.03); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes modalPopOut {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.92); }
      }

      .modal-overlay {
        animation: modalOverlayIn 0.2s ease-out;
      }

      .modal-overlay .modal {
        animation: modalPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .modal-overlay.closing {
        animation: modalOverlayOut 0.18s ease-in forwards;
      }

      .modal-overlay.closing .modal {
        animation: modalPopOut 0.18s ease-in forwards;
      }
    }

    /* Responsive */
    @media (max-width: 640px) {
      header h1 {
        font-size: 1.25rem;
      }

      header {
        padding: 1rem;
      }

      .tabs {
        gap: 0.35rem;
        padding: 0.25rem;
      }

      .tab-pill {
        padding: 0.55rem 0.5rem;
        font-size: 0.75rem;
      }

      /* Su mobile la griglia di card diventa un elenco: una riga per giocatore,
         letta da sinistra a destra (posizione, nome, record, rating). Impilate
         verticalmente costringevano a scorrere per confrontare due giocatori,
         che e' esattamente quello che si vuole fare qui. */
      .stats-grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      .stat-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 0.7rem;
        text-align: left;
        padding: 0.6rem 0.75rem;
      }

      .stat-rank,
      .stat-player,
      .stat-value,
      .stat-rating {
        margin: 0;
      }

      /* Un nome lungo viene troncato invece di andare a capo: la riga deve
         restare una riga, ed e' la colonna elastica della griglia (l'unica
         `minmax(0, 1fr)`) a cedere spazio. Il nome intero resta nel `title`
         della card. */
      .stat-player {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stat-record {
        text-align: right;
      }

      /* Il valore non deve piu' dominare la card: in riga compete con il nome
         e con il rating, non e' piu' il numero principale. */
      .stat-value {
        font-size: 1.05rem;
      }

      /* "W-L Record" e' l'elemento piu' largo della riga e il meno necessario:
         a 320px rubava al nome lo spazio che gli serve per stare su una riga
         sola. Resta nel DOM per chi usa uno screen reader, che altrimenti
         sentirebbe un "12-3" senza contesto, ma esce dal flusso visivo — come
         gia' avviene per lo stesso record sul podio, che non e' etichettato. */
      .stat-label {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .stat-rating {
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .podium {
        gap: 0.4rem;
      }

      .podium-name {
        font-size: 0.8rem;
      }

      .podium-rate {
        font-size: 0.75rem;
      }

      .podium-record {
        font-size: 0.7rem;
      }

      .podium-streak {
        font-size: 0.68rem;
      }

      .chart-legend {
        gap: 0.35rem 0.75rem;
      }

      .legend-item {
        font-size: 0.78rem;
      }

      .history-table {
        font-size: 0.85rem;
      }

      .history-table th, .history-table td {
        padding: 0.5rem;
      }

      /* Su schermo stretto select e radio vanno impilati */
      .player-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }

      .winner-pick {
        max-width: none;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Puzzle Bubble</h1>
    <button id="refreshBtn">⟳ Aggiorna</button>
  </header>

  <div class="container">
    <div id="message"></div>

    <button id="openFormBtn" class="btn-new-match">➕ Nuova Partita</button>

    <!-- Modale nuova partita -->
    <div id="matchModal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">➕ Nuova Partita</h2>
          <button type="button" id="closeFormBtn" class="modal-close" aria-label="Chiudi">✕</button>
        </div>

        <form id="matchForm">
          <p class="modal-hint">Scegli i due giocatori e segna chi ha vinto. La data viene registrata automaticamente.</p>

          <!-- Il radio indica lo slot; al submit viene tradotto nel nome del
               giocatore selezionato, che e' cio' che il foglio registra. -->
          <div class="player-row">
            <div class="player-field">
              <label for="player1">Giocatore 1</label>
              <select id="player1" required></select>
            </div>
            <label class="winner-pick">
              <input type="radio" name="winner" value="1" required>
              Vincitore
            </label>
          </div>

          <div class="player-row">
            <div class="player-field">
              <label for="player2">Giocatore 2</label>
              <select id="player2" required></select>
            </div>
            <label class="winner-pick">
              <input type="radio" name="winner" value="2">
              Vincitore
            </label>
          </div>

          <button type="submit" class="btn-submit">Salva Partita</button>
        </form>
      </div>
    </div>

    <!-- Nav a pills: tab-switch tra Statistiche, Storico e Grafici -->
    <div class="tabs" role="tablist" aria-label="Sezioni">
      <button type="button" id="tabStats" class="tab-pill active" role="tab"
        aria-selected="true" aria-controls="statsSection">📊 Statistiche</button>
      <button type="button" id="tabHistory" class="tab-pill" role="tab"
        aria-selected="false" aria-controls="historySection">📝 Storico</button>
      <button type="button" id="tabCharts" class="tab-pill" role="tab"
        aria-selected="false" aria-controls="chartsSection">📈 Grafici</button>
    </div>

    <!-- Stats sezione -->
    <section id="statsSection" role="tabpanel" aria-labelledby="tabStats">
      <h2>📊 Statistiche</h2>
      <div id="podium" class="podium"></div>
      <div id="stats" class="stats-grid">
        <div class="loading">
          <div class="spinner"></div>
          <p>Caricamento...</p>
        </div>
      </div>
    </section>

    <!-- History sezione -->
    <section id="historySection" role="tabpanel" aria-labelledby="tabHistory" hidden>
      <h2>📝 Storico Partite</h2>
      <div id="history">
        <div class="loading">
          <div class="spinner"></div>
          <p>Caricamento...</p>
        </div>
      </div>
    </section>

    <!-- Charts sezione -->
    <section id="chartsSection" role="tabpanel" aria-labelledby="tabCharts" hidden>
      <h2>📈 Grafici</h2>
      <div id="charts">
        <div class="loading">
          <div class="spinner"></div>
          <p>Caricamento...</p>
        </div>
      </div>
    </section>
  </div>

  <script>
    // CONFIG - MODIFICA QUESTO CON IL TUO URL
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrHf77BY5fpdT7jUr24ZOsAt8W61B8BZv59IhzemVVxpG5aalhTLbMoK8MKpAcsJ3iyg/exec'; // Sostituisci con il tuo

    let allMatches = [];
    let players = [];
    let renderedPlayers = null;
    let loadedOnce = false;
    let latestLoad = 0;
    let renderedLoad = 0;
    let inFlight = 0;
    let saving = false;
    let failStreak = 0;

    // Apps Script risponde con una pagina HTML quando Google intercala un
    // errore o una schermata di autorizzazione. response.json() in quel caso
    // muore con "Unexpected token '<'", che non dice nulla su cosa sia andato
    // storto: leggiamo il corpo come testo e diamo un errore parlante.
    function parseSheetResponse(body, response) {
      try {
        return JSON.parse(body);
      } catch {
        if (!response.ok) {
          throw new Error(`il foglio ha risposto ${response.status}`);
        }
        if (!body.trim()) {
          throw new Error('il foglio ha restituito una risposta vuota');
        }
        throw new Error('il foglio ha restituito una pagina HTML invece dei dati');
      }
    }

    // Utility: mostra messaggi
    function showMessage(msg, type = 'info') {
      const el = document.getElementById('message');
      el.innerHTML = `<div class="${type}">${msg}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }

    // Carica i dati dal Google Apps Script
    async function loadData() {
      // L'Apps Script risponde in tempi molto variabili (misurati 2s, 7s e 74s
      // su tre richieste di fila), quindi le risposte possono atterrare fuori
      // ordine. Una risposta va scartata solo se ne e' GIA' stata mostrata una
      // piu' recente: scartarla perche' e' partita una richiesta piu' nuova
      // terrebbe la pagina in caricamento per sempre ogni volta che la latenza
      // supera l'intervallo di polling.
      const seq = ++latestLoad;
      inFlight++;

      try {
        // Senza timeout una richiesta appesa non rifiuta mai la promise, e gli
        // spinner girerebbero a vuoto senza alcun messaggio d'errore.
        const response = await fetch(APPS_SCRIPT_URL, {
          signal: AbortSignal.timeout(90000)
        });
        const data = parseSheetResponse(await response.text(), response);

        if (seq < renderedLoad) return;

        if (data.success) {
          renderedLoad = seq;
          failStreak = 0;
          allMatches = data.matches || [];

          const found = new Set();
          allMatches.forEach(match => {
            found.add(match.giocatore1);
            found.add(match.giocatore2);
          });
          players = Array.from(found).sort();

          loadedOnce = true;
          updateUI();
        } else {
          handleLoadError('Errore nel caricamento dati');
        }
      } catch (error) {
        if (seq < renderedLoad) return;

        handleLoadError(error.name === 'TimeoutError'
          ? 'Il foglio non ha risposto in tempo'
          : 'Caricamento non riuscito: ' + error.message);
      } finally {
        inFlight--;
      }
    }

    // I dati gia' a schermo restano: un tick andato male non e' informazione
    // nuova sulle partite. Ma se non abbiamo mai caricato nulla gli spinner
    // girerebbero all'infinito, quindi li sostituiamo.
    //
    // I fallimenti isolati non vengono segnalati: sono episodi transitori che il
    // tick successivo recupera da solo, e con un polling ogni 10 secondi
    // segnalarli tutti riempirebbe la pagina di banner d'errore per nulla.
    function handleLoadError(msg) {
      failStreak++;

      if (!loadedOnce) {
        showMessage(msg, 'error');

        const text = 'Dati non disponibili. Premi ⟳ Aggiorna per riprovare.';
        document.getElementById('stats').innerHTML =
          `<p style="grid-column: 1/-1; text-align: center;">${text}</p>`;
        document.getElementById('history').innerHTML =
          `<p style="text-align: center;">${text}</p>`;
        return;
      }

      if (failStreak >= 3) showMessage(msg, 'error');
    }

    // Aggiorna dropdown giocatori, preservando la selezione in corso
    function updatePlayerSelects() {
      const select1 = document.getElementById('player1');
      const select2 = document.getElementById('player2');

      // Ricostruire le select azzera cio' che l'utente ha appena scelto, e
      // l'auto-refresh scatta ogni 10 secondi: se la lista giocatori non e'
      // cambiata non c'e' niente da rifare.
      const unchanged = renderedPlayers
        && renderedPlayers.length === players.length
        && renderedPlayers.every((p, i) => p === players[i]);

      if (unchanged) return;

      const prev1 = select1.value;
      const prev2 = select2.value;

      const options = '<option value="">-- Seleziona --</option>'
        + players.map(p => `<option value="${p}">${p}</option>`).join('');

      select1.innerHTML = options;
      select2.innerHTML = options;

      select1.value = players.includes(prev1) ? prev1 : '';
      select2.value = players.includes(prev2) ? prev2 : '';

      renderedPlayers = players;

      // Il rebuild puo' aver azzerato una selezione non piu' valida
      updateSubmitState();
    }

    // I nomi arrivano dal foglio e finiscono sia in HTML sia dentro un SVG
    // generato a stringa: una & o un < non sfuggiti spezzerebbero il markup, e
    // in SVG il risultato non e' un carattere sbagliato ma un grafico che non
    // compare affatto.
    function esc(value) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
      return String(value).replace(/[&<>"]/g, ch => map[ch]);
    }

    // Calcola statistiche per giocatore
    function getPlayerStats(player) {
      const played = allMatches.filter(
        m => m.giocatore1 === player || m.giocatore2 === player
      );

      // Sul foglio "vincitore" e' il nome del giocatore, non la sua posizione
      const wins = played.filter(m => m.vincitore === player).length;

      return { wins, losses: played.length - wins, played: played.length };
    }

    // ---------------------------------------------------------------------
    // Rating Elo
    // ---------------------------------------------------------------------

    // Tutti partono da 1000 e si scambiano K punti pesati sull'attesa, quindi
    // battere un avversario piu' forte vale piu' che battere uno piu' debole.
    // K=24 e' il compromesso tra separare i giocatori in poche decine di
    // partite e non far ballare la classifica a ogni singolo risultato.
    const ELO_START = 1000;
    const ELO_K = 24;

    // La data sul foglio ha granularita' di giorno: come chiave si usa
    // aaaa-mm-gg, che e' ordinabile come stringa.
    function matchDayKey(value) {
      if (!value) return null;

      // Una gg/mm/aaaa va letta com'e': passarla a new Date() la farebbe
      // interpretare alla americana (03/09 -> 9 marzo), come gia' in formatDate.
      const itDate = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(value).trim());
      if (itDate) return `${itDate[3]}-${itDate[2]}-${itDate[1]}`;

      const d = new Date(value);
      if (isNaN(d)) return null;

      // Il foglio manda mezzanotte locale come timestamp UTC: va riletta nel
      // fuso locale o ogni partita scivolerebbe al giorno prima.
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function todayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
    }

    // Differenza in giorni tra due chiavi: calcolata su Date.UTC, cosi' il
    // cambio di ora legale non fa comparire o sparire un giorno.
    function dayDiff(fromKey, toKey) {
      const [y1, m1, d1] = fromKey.split('-').map(Number);
      const [y2, m2, d2] = toKey.split('-').map(Number);
      return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
    }

    // Ordine canonico delle partite: per giornata crescente e, dentro la stessa
    // giornata, per ordine di riga sul foglio (l'unica sequenza disponibile,
    // visto che la data non ha orario). Serve un ordine unico perche' nell'Elo
    // la sequenza dei match conta: rating finale e classifiche giornaliere
    // devono raccontare la stessa storia.
    function chronologicalMatches() {
      // Una data illeggibile eredita la giornata della riga precedente invece
      // di essere scartata: la partita resta contata e la sequenza non si
      // spezza. Se capita in testa, eredita la prima giornata leggibile.
      const keys = allMatches.map(m => matchDayKey(m.data));
      let day = keys.find(Boolean) || todayKey();

      return allMatches
        .map((match, row) => {
          if (keys[row]) day = keys[row];
          return { match, row, day };
        })
        .sort((a, b) => a.day.localeCompare(b.day) || a.row - b.row);
    }

    // Stato incrementale della classifica: lo stesso replay serve sia per il
    // rating finale sia per la fotografia della classifica a fine giornata.
    function createStandings() {
      const ratings = new Map(players.map(p => [p, ELO_START]));
      const wins = new Map(players.map(p => [p, 0]));
      const played = new Map(players.map(p => [p, 0]));

      return {
        ratings,
        played,

        apply(match) {
          const a = match.giocatore1;
          const b = match.giocatore2;

          // Una riga il cui vincitore non e' nessuno dei due giocatori non e'
          // interpretabile: inventare un risultato falserebbe tutto il replay
          // successivo, quindi si salta.
          if (!ratings.has(a) || !ratings.has(b)) return;
          if (match.vincitore !== a && match.vincitore !== b) return;

          const scoreA = match.vincitore === a ? 1 : 0;
          const expectedA = 1 / (1 + Math.pow(10, (ratings.get(b) - ratings.get(a)) / 400));
          const delta = ELO_K * (scoreA - expectedA);

          // Somma zero: quello che A guadagna, B lo perde
          ratings.set(a, ratings.get(a) + delta);
          ratings.set(b, ratings.get(b) - delta);

          played.set(a, played.get(a) + 1);
          played.set(b, played.get(b) + 1);
          wins.set(match.vincitore, wins.get(match.vincitore) + 1);
        },

        // Solo chi ha gia' giocato: senza il filtro, a inizio storico tutti
        // sarebbero fermi a 1000 e la vetta la deciderebbe l'alfabeto.
        // L'ordine e' totale (rating, vittorie, partite, nome) perche' con il
        // refresh ogni 10 secondi due giocatori appaiati altrimenti si
        // scambierebbero di posto da soli a ogni tick.
        ranking() {
          return players
            .filter(p => played.get(p) > 0)
            .sort((a, b) =>
              ratings.get(b) - ratings.get(a)
              || wins.get(b) - wins.get(a)
              || played.get(b) - played.get(a)
              || a.localeCompare(b)
            );
        }
      };
    }

    // Rating ricalcolato da zero a ogni render invece che memorizzato: cosi'
    // qualunque correzione fatta a mano sul foglio si riflette subito, senza
    // stati salvati da tenere allineati.
    function computeRatings() {
      const standings = createStandings();
      chronologicalMatches().forEach(({ match }) => standings.apply(match));
      return standings.ratings;
    }

    // Classifica completa, ordinata come sopra.
    function rankedPlayers() {
      const ratings = computeRatings();

      return players
        .map(player => ({ player, rating: ratings.get(player), ...getPlayerStats(player) }))
        .sort((a, b) =>
          b.rating - a.rating
          || b.wins - a.wins
          || b.played - a.played
          || a.player.localeCompare(b.player)
        );
    }

    // Classifica alla fine di ogni giornata giocata: serve sia alla permanenza
    // in vetta sia al grafico dell'andamento.
    function dailyRankings() {
      const standings = createStandings();
      const byDay = [];
      let currentDay = null;

      chronologicalMatches().forEach(({ match, day }) => {
        // Cambio giornata: prima si fotografa la classifica come si e' chiusa
        // il giorno precedente, poi si applica la partita nuova.
        if (currentDay !== null && day !== currentDay) {
          byDay.push({ day: currentDay, ranking: standings.ranking() });
        }
        currentDay = day;
        standings.apply(match);
      });

      if (currentDay !== null) {
        byDay.push({ day: currentDay, ranking: standings.ranking() });
      }

      return byDay;
    }

    // Da quanti giorni il leader attuale e' in vetta: si risale indietro
    // finche' la classifica di fine giornata ha lo stesso primo posto. Il conto
    // e' in giorni di calendario, quindi include i giorni senza partite — chi e'
    // in vetta ci resta anche quando nessuno gioca, ed e' quello che la frase
    // "da N giorni al comando" promette.
    function leaderStreak(byDay) {
      if (byDay.length === 0) return null;

      const leader = byDay[byDay.length - 1].ranking[0];
      if (!leader) return null;

      let since = byDay[byDay.length - 1].day;
      for (let i = byDay.length - 1; i >= 0; i--) {
        if (byDay[i].ranking[0] !== leader) break;
        since = byDay[i].day;
      }

      // Minimo un giorno: chi ha preso la vetta oggi e' comunque in vetta da un
      // giorno, e una data futura battuta a mano sul foglio non deve produrre
      // numeri negativi.
      return { leader, days: Math.max(1, dayDiff(since, todayKey())) };
    }

    // Podio dei 3 rating piu' alti, con la permanenza in vetta sul primo posto.
    function updatePodium() {
      const podiumDiv = document.getElementById('podium');
      const ranked = rankedPlayers().slice(0, 3);

      if (ranked.length === 0) {
        podiumDiv.innerHTML = '';
        return;
      }

      const streak = leaderStreak(dailyRankings());
      const medals = ['🥇', '🥈', '🥉'];

      // Ordine visivo: secondo a sinistra, primo al centro, terzo a destra
      const layout = [1, 0, 2].filter(i => i < ranked.length);

      podiumDiv.innerHTML = layout.map(i => {
        const r = ranked[i];

        // La permanenza ha senso solo sulla vetta. Il confronto sul nome e' una
        // rete di sicurezza: le due classifiche usano lo stesso ordinamento, ma
        // se divergessero e' meglio non mostrare nulla che mostrare il falso.
        const streakLine = i === 0 && streak && streak.leader === r.player
          ? `<div class="podium-streak">👑 ${streak.days} ${streak.days === 1 ? 'day streak' : 'days streak'}</div>`
          : '';

        return `
          <div class="podium-place podium-${i + 1}">
            <div class="podium-medal">${medals[i]}</div>
            <div class="podium-name">${esc(r.player)}</div>
            ${streakLine}
            <div class="podium-rate">${Math.round(r.rating)} Elo</div>
            <div class="podium-record">${r.wins}-${r.losses}</div>
            <div class="podium-block">${i + 1}</div>
          </div>
        `;
      }).join('');
    }

    // Aggiorna le statistiche
    function updateStats() {
      const statsDiv = document.getElementById('stats');

      if (players.length === 0) {
        statsDiv.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Nessun dato ancora</p>';
        return;
      }

      // Ordinate per classifica, non alfabeticamente: la griglia continua il
      // podio invece di ripartire da capo con un altro criterio, e la posizione
      // di una card diventa essa stessa un'informazione. `rankedPlayers` usa un
      // ordine totale, quindi l'auto-refresh non le fa ballare.
      // Record e etichetta stanno in un contenitore comune: su mobile la card
      // diventa una riga e i due devono spostarsi come un blocco solo.
      statsDiv.innerHTML = rankedPlayers().map((r, i) => `
          <div class="stat-card" title="${esc(r.player)}">
            <div class="stat-rank">#${i + 1}</div>
            <div class="stat-player">${esc(r.player)}</div>
            <div class="stat-record">
              <div class="stat-value">${r.wins}-${r.losses}</div>
              <div class="stat-label">W-L Record</div>
            </div>
            <div class="stat-rating">${Math.round(r.rating)} Elo</div>
          </div>
        `).join('');
    }

    // Il foglio restituisce le date come timestamp ISO in UTC: la mezzanotte
    // locale diventa 22:00Z del giorno prima, quindi va formattata nel fuso
    // locale o ogni partita risulterebbe giocata il giorno precedente.
    function formatDate(value) {
      if (!value) return '?';

      // Una gg/mm/aaaa e' gia' nel formato giusto e va restituita cosi': passarla
      // a new Date() la farebbe leggere alla americana (03/09 -> 9 marzo).
      const itDate = /^\d{2}\/\d{2}\/\d{4}$/.exec(String(value).trim());
      if (itDate) return itDate[0];

      const d = new Date(value);
      if (isNaN(d)) return value;

      return d.toLocaleDateString('it-IT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    // Aggiorna lo storico
    function updateHistory() {
      const historyDiv = document.getElementById('history');

      if (allMatches.length === 0) {
        historyDiv.innerHTML = '<p style="text-align: center;">Nessuna partita ancora</p>';
        return;
      }

      // Il vincitore non ha piu' una colonna sua: ripeteva un nome gia' presente
      // in una delle due colonne dei giocatori. Ora e' quel nome a portare la
      // corona, e la tabella sta in tre colonne anche su mobile.
      const playerCell = (name, winner) => name === winner
        ? `<td><span class="winner-name">👑 ${esc(name)}</span></td>`
        : `<td>${esc(name)}</td>`;

      const sorted = [...allMatches].reverse();
      const rows = sorted.map(match => `
          <tr>
            <td>${formatDate(match.data)}</td>
            ${playerCell(match.giocatore1, match.vincitore)}
            ${playerCell(match.giocatore2, match.vincitore)}
          </tr>
        `).join('');

      historyDiv.innerHTML = `
        <table class="history-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Giocatore 1</th>
              <th>Giocatore 2</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    // ---------------------------------------------------------------------
    // Grafici
    // ---------------------------------------------------------------------

    // Palette categorica verificata sul fondo del pannello (#1a0b3d): banda di
    // luminosita', chroma, separazione per daltonismo (ΔE 8.4 sulla coppia
    // adiacente peggiore), separazione a vista normale (19.3) e contrasto
    // (tutti >= 3:1). E' l'ORDINE a essere stato verificato, non l'insieme:
    // rimescolare gli slot invalida la garanzia.
    const SERIES_COLORS = [
      '#3987e5', '#d95926', '#199e70', '#c98500',
      '#d55181', '#008300', '#9085e9', '#e66767'
    ];

    // Oltre l'ottavo giocatore i colori non si riciclano: due serie dello stesso
    // colore ingannano piu' di quanto un colore in meno non informi. Chi eccede
    // resta identificato dall'etichetta diretta.
    const SERIES_OVERFLOW = '#8b86a8';

    // Larghezza media di un carattere alle dimensioni usate qui: serve solo a
    // riservare lo spazio delle etichette, non vale la pena misurarla nel DOM.
    const CHAR_W = 6.6;

    // Il colore segue il giocatore, non la sua posizione in classifica: legato
    // all'indice alfabetico resta lo stesso in tutti i grafici e tra un refresh
    // e l'altro.
    function playerColor(name) {
      const index = players.indexOf(name);
      return index >= 0 && index < SERIES_COLORS.length ? SERIES_COLORS[index] : SERIES_OVERFLOW;
    }

    function formatDayLabel(key) {
      const [, month, day] = key.split('-');
      return `${day}/${month}`;
    }

    function fitLabel(name, maxWidth) {
      const maxChars = Math.max(3, Math.floor(maxWidth / CHAR_W));
      return name.length > maxChars ? `${name.slice(0, maxChars - 1)}…` : name;
    }

    // Indici delle etichette da mostrare su un asse. Quante ne stanno lo decide
    // lo spazio, non un numero fisso: una "gg/mm" occupa una quarantina di
    // pixel, e a 320px cinque date si toccherebbero fino a diventare una
    // macchia illeggibile. Il tetto di cinque vale per gli schermi larghi, dove
    // il limite non e' piu' lo spazio ma l'affollamento.
    function axisTicks(count, plotW) {
      const fits = Math.max(2, Math.floor(plotW / 58));
      const wanted = Math.min(5, fits, count);
      const picked = new Set();

      for (let t = 0; t < wanted; t++) {
        picked.add(wanted === 1 ? 0 : Math.round(t * (count - 1) / (wanted - 1)));
      }

      return [...picked];
    }

    // Le etichette agli estremi vanno ancorate verso l'interno o sporgono oltre
    // il bordo dell'SVG e vengono tagliate.
    function tickAnchor(index, count) {
      if (index === 0) return 'start';
      if (index === count - 1) return 'end';
      return 'middle';
    }

    // Barra orizzontale con la sola estremita' dei dati arrotondata: l'origine
    // resta appoggiata alla baseline, cosi' la lunghezza si legge da un bordo
    // netto invece che da due angoli smussati.
    function hBarPath(x, y, w, h, r) {
      const rr = Math.max(0, Math.min(r, w, h / 2));
      return `M${x} ${y} H${x + w - rr} A${rr} ${rr} 0 0 1 ${x + w} ${y + rr}`
        + ` V${y + h - rr} A${rr} ${rr} 0 0 1 ${x + w - rr} ${y + h} H${x} Z`;
    }

    // Idem in verticale, arrotondata solo in cima.
    function vBarPath(x, y, w, h, r) {
      const rr = Math.max(0, Math.min(r, w / 2, h));
      return `M${x} ${y + h} V${y + rr} A${rr} ${rr} 0 0 1 ${x + rr} ${y}`
        + ` H${x + w - rr} A${rr} ${rr} 0 0 1 ${x + w} ${y + rr} V${y + h} Z`;
    }

    function chartFigure(title, body) {
      return `<figure class="chart-figure">
        <figcaption class="chart-title">${title}</figcaption>
        ${body}
      </figure>`;
    }

    function svgWrap(width, height, label, content) {
      return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}"
        role="img" aria-label="${esc(label)}">${content}</svg>`;
    }

    function chartNote(text) {
      return `<p class="chart-note">${text}</p>`;
    }

    // Legenda condivisa dai grafici che usano il colore per identificare i
    // giocatori: con due o piu' serie l'identita' non puo' stare nel solo colore.
    function renderLegend() {
      const items = players.map(player => `
        <span class="legend-item">
          <span class="legend-swatch" style="background: ${playerColor(player)}"></span>${esc(player)}
        </span>
      `).join('');

      return `<div class="chart-legend">${items}</div>`;
    }

    // Andamento della POSIZIONE in classifica, non del rating: la domanda a cui
    // il grafico risponde e' "chi sta salendo", e con i rating grezzi le linee
    // di giocatori vicini si sovrappongono fino a non distinguersi piu'.
    function renderRankHistory(width, byDay) {
      const title = 'Andamento classifica';

      if (byDay.length < 2) {
        return chartFigure(title, chartNote('Servono almeno due giornate di partite per disegnare un andamento.'));
      }

      // Oltre gli slot della palette le linee si accavallano e i colori
      // finirebbero comunque: il grafico si ferma ai primi in classifica.
      const shown = rankedPlayers().slice(0, SERIES_COLORS.length).map(r => r.player);
      const positions = players.length;

      // Le etichette dirette hanno senso finche' restano poche: oltre, il posto
      // che occupano vale piu' del grafico che resta.
      const direct = shown.length <= 4;
      const longest = shown.reduce((max, name) => Math.max(max, name.length), 0);

      const padTop = 10;
      const padBottom = 26;
      const padLeft = 26;
      const padRight = direct ? Math.min(84, longest * CHAR_W + 12) : 8;

      const step = 26;
      const plotW = Math.max(40, width - padLeft - padRight);
      const plotH = Math.max(step, (positions - 1) * step);
      const height = padTop + plotH + padBottom;

      const xDay = i => padLeft + (i * plotW) / (byDay.length - 1);
      const yPos = pos => padTop + (positions > 1 ? ((pos - 1) * plotH) / (positions - 1) : plotH / 2);

      const grid = Array.from({ length: positions }, (_, k) => {
        const y = yPos(k + 1).toFixed(1);
        return `<line x1="${padLeft}" y1="${y}" x2="${padLeft + plotW}" y2="${y}"
            stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <text x="${padLeft - 8}" y="${(yPos(k + 1) + 4).toFixed(1)}" text-anchor="end"
            font-size="11" style="fill: var(--text-muted)">${k + 1}</text>`;
      }).join('');

      // Con molte giornate i pallini si toccano fino a diventare una linea
      // spessa: sopra la ventina resta solo l'ultimo, che serve da appiglio per
      // l'etichetta e per il tooltip sulla posizione attuale.
      const showDots = byDay.length <= 20;

      const series = shown.map(player => {
        const points = [];

        byDay.forEach((entry, i) => {
          const pos = entry.ranking.indexOf(player);
          if (pos >= 0) points.push({ x: xDay(i), y: yPos(pos + 1), day: entry.day, pos: pos + 1 });
        });

        if (points.length === 0) return '';

        const color = playerColor(player);
        const last = points[points.length - 1];

        const line = points.length > 1
          ? `<polyline points="${points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}"
              fill="none" stroke="${color}" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>`
          : '';

        // Anello nel colore del pannello: dove due linee si incrociano il punto
        // resta staccato da quella che gli passa sotto.
        const dots = points
          .filter(p => showDots || p === last)
          .map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}"
              style="stroke: var(--bg-panel)" stroke-width="2"><title>${esc(player)} — ${formatDayLabel(p.day)}: ${p.pos}° posto</title></circle>`)
          .join('');

        // Le posizioni sono uniche per definizione, quindi due etichette dirette
        // non possono finire sulla stessa altezza.
        const label = direct
          ? `<text x="${(padLeft + plotW + 7).toFixed(1)}" y="${(last.y + 4).toFixed(1)}"
              font-size="11" style="fill: var(--text-primary)">${esc(fitLabel(player, padRight - 12))}</text>`
          : '';

        return line + dots + label;
      }).join('');

      const labels = axisTicks(byDay.length, plotW).map(i => `
        <text x="${xDay(i).toFixed(1)}" y="${height - 8}" font-size="11"
          text-anchor="${tickAnchor(i, byDay.length)}"
          style="fill: var(--text-muted)">${formatDayLabel(byDay[i].day)}</text>
      `).join('');

      return chartFigure(title,
        svgWrap(width, height, 'Posizione in classifica di ogni giocatore giorno per giorno', grid + series + labels)
        + chartNote('La prima posizione è in alto.'));
    }

    // Partite giocate: barre orizzontali con il nome accanto, quindi l'identita'
    // non dipende dal colore ed e' leggibile anche oltre gli slot della palette.
    function renderGamesPlayed(width) {
      const rows = players
        .map(player => ({ player, played: getPlayerStats(player).played }))
        .sort((a, b) => b.played - a.played || a.player.localeCompare(b.player));

      const barH = 18;
      const gap = 10;
      const padY = 6;
      const longest = rows.reduce((max, r) => Math.max(max, r.player.length), 0);
      const labelW = Math.min(96, longest * CHAR_W + 4);
      const valueW = 34;
      const plotW = Math.max(20, width - labelW - valueW - 8);
      const max = Math.max(...rows.map(r => r.played));
      const height = padY * 2 + rows.length * barH + Math.max(0, rows.length - 1) * gap;

      const bars = rows.map((r, i) => {
        const y = padY + i * (barH + gap);
        const w = Math.max(3, (r.played / max) * plotW);
        const baseline = labelW + 8;

        return `
          <text x="0" y="${y + barH / 2 + 4}" font-size="12"
            style="fill: var(--text-primary)">${esc(fitLabel(r.player, labelW))}</text>
          <path d="${hBarPath(baseline, y, w, barH, 4)}" fill="${playerColor(r.player)}"><title>${esc(r.player)}: ${r.played} partite</title></path>
          <text x="${(baseline + w + 6).toFixed(1)}" y="${y + barH / 2 + 4}" font-size="12"
            style="fill: var(--text-muted)">${r.played}</text>
        `;
      }).join('');

      return chartFigure('Partite giocate',
        svgWrap(width, height, 'Numero di partite giocate da ogni giocatore', bars));
    }

    // Vittorie per giorno: l'altezza della barra e' quanto si e' giocato quel
    // giorno, i segmenti dicono chi ha vinto. Le due letture insieme.
    function renderWinsPerDay(width) {
      const title = 'Vittorie per giorno';

      // Solo le giornate in cui si e' giocato: le barre a zero dei giorni vuoti
      // svuoterebbero il grafico dopo ogni pausa lunga.
      const index = new Map();
      const days = [];

      chronologicalMatches().forEach(({ match, day }) => {
        if (match.vincitore !== match.giocatore1 && match.vincitore !== match.giocatore2) return;

        if (!index.has(day)) {
          index.set(day, { day, winners: new Map(), total: 0 });
          days.push(index.get(day));
        }

        const entry = index.get(day);
        entry.winners.set(match.vincitore, (entry.winners.get(match.vincitore) || 0) + 1);
        entry.total++;
      });

      if (days.length === 0) {
        return chartFigure(title, chartNote('Nessuna partita con un vincitore riconoscibile.'));
      }

      const padTop = 8;
      const padBottom = 24;
      const padLeft = 24;
      const plotW = Math.max(20, width - padLeft - 6);
      const plotH = 150;
      const height = padTop + plotH + padBottom;

      const max = Math.max(...days.map(d => d.total));
      const unit = plotH / max;
      const slot = plotW / days.length;
      // 2px di respiro tra barre adiacenti, e un tetto alla larghezza: con due
      // sole giornate barre da mezzo grafico sembrerebbero un'altra cosa.
      const barW = Math.max(3, Math.min(30, slot - 2));

      const tickStep = Math.max(1, Math.ceil(max / 4));
      const gridLines = [];
      for (let v = 0; v <= max; v += tickStep) {
        const y = padTop + plotH - v * unit;
        gridLines.push(`<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${padLeft + plotW}" y2="${y.toFixed(1)}"
          stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <text x="${padLeft - 7}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11"
            style="fill: var(--text-muted)">${v}</text>`);
      }

      const bars = days.map((entry, i) => {
        const x = padLeft + i * slot + (slot - barW) / 2;

        // Ordine di impilamento per indice del giocatore: e' lo stesso in tutte
        // le giornate, quindi i segmenti non si scambiano di posto da una barra
        // all'altra.
        const segments = [...entry.winners.entries()]
          .sort((a, b) => players.indexOf(a[0]) - players.indexOf(b[0]));

        let stacked = 0;

        return segments.map(([name, count], k) => {
          const y = padTop + plotH - (stacked + count) * unit;
          stacked += count;

          // Lo stacco tra un vincitore e l'altro lo fa lo sfondo, non una riga
          // di bordo: il segmento si ritira di 2px dall'alto. Su un segmento
          // gia' sottilissimo lo stacco si dimezza invece di mangiarselo.
          const full = count * unit;
          const gap = Math.min(2, full / 2);
          const segH = full - gap;

          // Solo il segmento in cima porta gli angoli arrotondati: quelli sotto
          // restano squadrati, o la barra sembrerebbe spezzata in tante barrette.
          const isTop = k === segments.length - 1;
          const tooltip = `<title>${formatDayLabel(entry.day)} — ${esc(name)}: ${count} ${count === 1 ? 'vittoria' : 'vittorie'}</title>`;
          const fill = playerColor(name);

          if (isTop) {
            return `<path d="${vBarPath(x, y + gap, barW, segH, 4)}" fill="${fill}">${tooltip}</path>`;
          }

          return `<rect x="${x.toFixed(1)}" y="${(y + gap).toFixed(1)}"
            width="${barW.toFixed(1)}" height="${segH.toFixed(1)}" fill="${fill}">${tooltip}</rect>`;
        }).join('');
      }).join('');

      const labels = axisTicks(days.length, plotW).map(i => `
        <text x="${(padLeft + i * slot + slot / 2).toFixed(1)}" y="${height - 7}" font-size="11"
          text-anchor="${tickAnchor(i, days.length)}"
          style="fill: var(--text-muted)">${formatDayLabel(days[i].day)}</text>
      `).join('');

      return chartFigure(title,
        svgWrap(width, height, 'Partite giocate per giornata, divise per vincitore', gridLines.join('') + bars + labels)
        + chartNote('Altezza della barra: partite giocate quel giorno.'));
    }

    // I grafici si dimensionano sulla larghezza reale del contenitore invece di
    // usare un viewBox fisso: con un viewBox da 600 reso dentro 320px tutte le
    // etichette si dimezzerebbero. Il rovescio e' che finche' la sezione e'
    // hidden quella larghezza vale 0, quindi si disegna all'apertura della tab
    // (vedi onTabShown) e al resize, non solo quando arrivano i dati.
    function updateCharts() {
      const host = document.getElementById('charts');
      const width = host.clientWidth;

      if (!width) return;

      if (allMatches.length === 0) {
        host.innerHTML = '<p style="text-align: center;">Nessuna partita ancora</p>';
        return;
      }

      host.innerHTML = renderLegend()
        + renderRankHistory(width, dailyRankings())
        + renderGamesPlayed(width)
        + renderWinsPerDay(width);
    }

    // Aggiorna tutta l'UI
    function updateUI() {
      updatePlayerSelects();
      updatePodium();
      updateStats();
      updateHistory();
      // No-op se la tab Grafici e' chiusa: in quel caso ridisegna onTabShown
      updateCharts();
    }

    // Con prefers-reduced-motion:reduce nessuna regola CSS "animation" esiste
    // per .tab-leaving/.closing (vedi <style>): l'animationend che il resto
    // del codice attende non arriverebbe mai, quindi qui si aggira l'attesa.
    function prefersReducedMotion() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    // Apertura / chiusura del modale
    const matchModal = document.getElementById('matchModal');
    const matchForm = document.getElementById('matchForm');
    const submitBtn = matchForm.querySelector('.btn-submit');

    // Il salvataggio resta bloccato finche' la partita non e' plausibile: due
    // giocatori entrambi scelti e diversi tra loro, piu' un vincitore.
    function updateSubmitState() {
      // Durante il salvataggio il pulsante lo governa il submit, non questa:
      // l'auto-refresh in background non deve riabilitarlo a meta' richiesta.
      if (saving) return;

      const g1 = document.getElementById('player1').value;
      const g2 = document.getElementById('player2').value;
      const winner = matchForm.querySelector('input[name="winner"]:checked');

      submitBtn.disabled = !g1 || !g2 || g1 === g2 || !winner;
    }

    function openModal() {
      // L'animazione di apertura riparte da sola in CSS alla rimozione di
      // "hidden" (vedi .modal-overlay/.modal nel <style>), nessun'altra
      // orchestrazione JS necessaria qui.
      matchModal.hidden = false;
      updateSubmitState();
      document.getElementById('player1').focus();
    }

    function closeModal() {
      // Gia' chiuso, o chiusura gia' in corso: evita di riavviare l'animazione
      // o di accumulare listener duplicati su pressioni ripetute di Esc.
      if (matchModal.hidden || matchModal.classList.contains('closing')) return;

      const finish = () => {
        matchModal.hidden = true;
        matchModal.classList.remove('closing');
        matchForm.reset();
        updateSubmitState();
      };

      if (prefersReducedMotion()) {
        finish();
        return;
      }

      matchModal.classList.add('closing');
      matchModal.addEventListener('animationend', finish, { once: true });
    }

    document.getElementById('openFormBtn').addEventListener('click', openModal);
    document.getElementById('closeFormBtn').addEventListener('click', closeModal);

    // Nav a pills: indipendente dal modale, nessuno stato persistito tra reload
    const tabs = [
      { btn: document.getElementById('tabStats'), panel: document.getElementById('statsSection') },
      { btn: document.getElementById('tabHistory'), panel: document.getElementById('historySection') },
      { btn: document.getElementById('tabCharts'), panel: document.getElementById('chartsSection') }
    ];

    let activeTabId = tabs.find(({ panel }) => !panel.hidden).panel.id;
    // Uscita animata in corso (se presente): tenerne un riferimento esplicito
    // permette di annullarla con removeEventListener invece di lasciare che
    // un vecchio animationend scaduto sovrascriva uno stato piu' recente,
    // nel caso l'utente clicchi un'altra pill prima che finisca.
    let pendingExit = null;

    function cancelPendingExit() {
      if (!pendingExit) return;
      pendingExit.panel.removeEventListener('animationend', pendingExit.listener);
      pendingExit.panel.classList.remove('tab-leaving');
      pendingExit = null;
    }

    // I grafici si misurano sulla larghezza del contenitore, che finche' la
    // sezione e' hidden vale 0: vanno (ri)disegnati nel momento in cui la
    // sezione diventa visibile, non quando arrivano i dati.
    function onTabShown(panel) {
      if (panel.id === 'chartsSection') updateCharts();
    }

    function switchTab(panelId) {
      if (panelId === activeTabId) return;

      const previousActiveId = activeTabId;
      activeTabId = panelId;

      // Stato ARIA/pill aggiornato subito al click, indipendente dalla durata
      // dell'animazione della sezione (vedi requisito accessibilita').
      tabs.forEach(({ btn, panel }) => {
        const active = panel.id === panelId;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', String(active));
      });

      const incoming = tabs.find(t => t.panel.id === panelId).panel;
      const outgoing = tabs.find(t => t.panel.id === previousActiveId).panel;

      if (pendingExit && pendingExit.panel === incoming) {
        // La pill appena scelta e' quella la cui sezione stava ancora sparendo
        // da un cambio precedente (avanti-indietro rapido): e' gia' visibile,
        // basta annullarne l'uscita.
        cancelPendingExit();
        onTabShown(incoming);
        return;
      }

      if (pendingExit) {
        // Un'uscita diversa era in corso: il suo turno e' scavalcato dalla
        // nuova scelta, va conclusa subito senza aspettare l'animazione.
        pendingExit.panel.hidden = true;
        cancelPendingExit();
      }

      if (prefersReducedMotion()) {
        outgoing.hidden = true;
        incoming.hidden = false;
        onTabShown(incoming);
        return;
      }

      outgoing.classList.add('tab-leaving');
      const onLeaveEnd = () => {
        outgoing.hidden = true;
        outgoing.classList.remove('tab-leaving');
        pendingExit = null;
        incoming.hidden = false;
        onTabShown(incoming);
      };
      outgoing.addEventListener('animationend', onLeaveEnd, { once: true });
      pendingExit = { panel: outgoing, listener: onLeaveEnd };
    }

    tabs.forEach(({ btn, panel }) => {
      btn.addEventListener('click', () => switchTab(panel.id));
    });

    // Copre sia i due select sia i radio
    matchForm.addEventListener('change', updateSubmitState);
    updateSubmitState();

    // Click sullo sfondo (non sul riquadro) e tasto Esc chiudono
    matchModal.addEventListener('click', (e) => {
      if (e.target === matchModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !matchModal.hidden) closeModal();
    });

    // Data di oggi in formato gg/mm/aaaa. E' il formato che il foglio (locale
    // italiano) riconosce come data vera: inviando "2026-09-03" Sheets non lo
    // interpreta e lo archivia come semplice testo, disallineato dalle altre
    // righe. Usa il fuso locale, quindi una partita giocata a tarda sera non
    // slitta al giorno precedente come farebbe toISOString().
    function todayLocale() {
      return new Date().toLocaleDateString('it-IT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    // Gestisci submit form
    matchForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const winnerSlot = document.querySelector('input[name="winner"]:checked');

      if (!winnerSlot) {
        showMessage('Seleziona il vincitore', 'error');
        return;
      }

      const giocatore1 = document.getElementById('player1').value;
      const giocatore2 = document.getElementById('player2').value;

      // Validazione base
      if (!giocatore1 || !giocatore2 || giocatore1 === giocatore2) {
        showMessage('Seleziona due giocatori diversi', 'error');
        return;
      }

      const formData = {
        data: todayLocale(),
        giocatore1,
        giocatore2,
        // Il foglio registra il nome del vincitore, non la sua posizione
        vincitore: winnerSlot.value === '1' ? giocatore1 : giocatore2
      };

      // Il salvataggio su Apps Script puo' essere lento: senza questo, un
      // doppio click scrive due volte la stessa partita sul foglio.
      saving = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Salvataggio...';

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          // NON usare application/json: renderebbe la richiesta "non-simple" e
          // il browser manderebbe prima un preflight OPTIONS, che le Web App
          // Apps Script non autorizzano (rispondono 200 senza header
          // access-control-*, e il browser blocca la POST). Con text/plain la
          // richiesta e' simple e parte senza preflight; il corpo resta lo
          // stesso JSON, che lo script legge da e.postData.contents.
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(formData),
          // Senza timeout una POST appesa lascerebbe il pulsante su
          // "Salvataggio..." per sempre, senza modo di riprovare.
          signal: AbortSignal.timeout(90000)
        });

        const result = parseSheetResponse(await response.text(), response);

        if (result.success) {
          showMessage('✅ Partita salvata!', 'success');
          closeModal();
          await loadData();
        } else {
          showMessage('Errore nel salvataggio: ' + result.error, 'error');
        }
      } catch (error) {
        // Qui l'errore va sempre mostrato: a differenza del polling, non c'e'
        // un tentativo successivo automatico e la partita andrebbe persa.
        showMessage(error.name === 'TimeoutError'
          ? 'Salvataggio non confermato in tempo: controlla il foglio prima di riprovare'
          : 'Salvataggio non riuscito: ' + error.message, 'error');
      } finally {
        // In caso di errore il modale resta aperto coi dati inseriti, pronto
        // per un altro tentativo; dopo un successo il form e' stato resettato,
        // quindi updateSubmitState lo ritrova vuoto e tiene il pulsante spento.
        saving = false;
        submitBtn.textContent = 'Salva Partita';
        updateSubmitState();
      }
    });

    // Refresh button
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadData();
    });

    // Gli SVG sono generati sulla larghezza misurata al momento del disegno,
    // quindi un resize (o una rotazione del telefono) li lascerebbe alla
    // larghezza vecchia. Il debounce evita di rigenerarli a ogni pixel di
    // trascinamento della finestra.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!document.getElementById('chartsSection').hidden) updateCharts();
      }, 150);
    });

    // Carica dati on mount
    window.addEventListener('load', () => {
      loadData();

      // Auto-refresh ogni 10 secondi, ma senza accodare richieste: con risposte
      // che possono durare oltre un minuto si accumulerebbero a decine.
      setInterval(() => {
        if (inFlight === 0) loadData();
      }, 10000);
    });
  </script>
</body>
</html>
